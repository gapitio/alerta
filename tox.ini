[tox]
envlist = py{311,312,313,314}-postgres
skip_missing_interpreters=true

[testenv]
deps =
  pytest
  requests_mock
  postgres: psycopg2
  python-ldap
  lxml
  pysaml2

whitelist_externals =
  createdb
  dropdb
  pytest

commands_pre =
  postgres: -createdb alerta
commands = pytest -s {posargs:tests}
commands_post =
  postgres: -dropdb alerta

#passenv = *
setenv =
  ALERTA_SVR_CONF_FILE =
  postgres: DATABASE_URL = postgres:///alerta
